name: Secure CI/CD - democyber

# Trigger the workflow on push or pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # -------------------------------
      # Checkout code
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -------------------------------
      # SECURITY: Gitleaks Secret Scanning
      # -------------------------------
      - name: Run Gitleaks scan
        uses: zricethezav/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif

      # -------------------------------
      # SECURITY: Python Security Scanning
      # -------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python security tools
        run: pip install bandit safety

      - name: Run Bandit scan
        continue-on-error: true
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . || true

      - name: Run Safety scan
        continue-on-error: true
        run: |
          safety check --json --output safety-report.json || true
          safety check || true

      - name: Upload Python security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: |
            bandit-report.json
            safety-report.json

      # -------------------------------
      # BUILD: Java Application
      # -------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Java
        run: mvn compile

      - name: Build Java project with Maven
        run: mvn clean package

      # -------------------------------
      # CODE QUALITY: SonarCloud Analysis
      # -------------------------------
      - name: SonarCloud Scan with Maven
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.projectKey=nawreshichri-c_exam-devsecops \
            -Dsonar.organization=nawreshichri-c \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # -------------------------------
      # DOCKER: Build, Test & Push
      # -------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Docker login
        run: docker info

      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 $DOCKER_IMAGE_NAME
          sleep 10
          curl -f http://localhost:8080 || echo "App not responding"
          docker stop democyber-test
          docker rm democyber-test

      # -------------------------------
      # SECURITY: Trivy Vulnerability Scanning
      # -------------------------------
      - name: Scan Docker image with Trivy (Table Format)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Scan Docker image with Trivy (SARIF Format)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif

      # -------------------------------
      # Push Docker image
      # -------------------------------
      - name: Push Docker image
        run: docker push $DOCKER_IMAGE_NAME

      # -------------------------------
      # SUMMARY
      # -------------------------------
      - name: Pipeline Summary
        if: success()
        run: |
          echo "✅ Security scans passed"
          echo "✅ Build successful"
          echo "✅ Tests passed"
          echo "✅ Image pushed to Docker Hub: $DOCKER_IMAGE_NAME"
